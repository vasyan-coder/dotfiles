# Persistent Herdr-style navigator, implemented locally with Python + tmux.
# Two stacked sections in one left pane. No downloads or external services.
set -g mouse on
set -g @herdr_sidebar_enabled on
set -g pane-border-lines single
set -g automatic-rename-format '#{?#{==:#{@herdr_sidebar},1},#{window_name},#{pane_current_command}}'

# Keep all existing prefix/window/session shortcuts.
bind b run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py focus"
bind B run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py toggle"

# Target the mouse pane without focusing it; click directly selects the real pane.
bind -n MouseDown1Pane if-shell -F -t = '#{==:#{@herdr_sidebar},1}' 'run-shell -b -t = "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py click --pane #{pane_id} --client #{q:client_name} --y #{mouse_y}"' 'select-pane -t = ; send-keys -M'
# Wheel events go directly to the persistent UI: no process per tick, no mailbox.
bind -n WheelUpPane if-shell -F -t = '#{==:#{@herdr_sidebar},1}' {
    if-shell -F -t = '#{e|>=:#{mouse_y},#{@navigator_divider}}' { send-keys -t = F5 } { send-keys -t = F7 }
} { if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -et = ; send-keys -M } }
bind -n WheelDownPane if-shell -F -t = '#{==:#{@herdr_sidebar},1}' {
    if-shell -F -t = '#{e|>=:#{mouse_y},#{@navigator_divider}}' { send-keys -t = F6 } { send-keys -t = F8 }
} { send-keys -M }

# Indexed hooks coexist with other configuration. Existing UIs survive reloads.
set-hook -g after-new-window[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --window #{window_id}"'
set-hook -g after-select-window[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --window #{window_id}"'
set-hook -g session-created[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --all"'
set-hook -g client-attached[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --all"'
set-hook -g client-resized[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --all"'
set-hook -g after-kill-pane[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py prune --all"'
set-hook -g pane-exited[90] 'run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py prune --all"'
run-shell -b "/usr/bin/python3 /Users/vasyan/.config/tmux/navigator/sidebar.py ensure --all"
