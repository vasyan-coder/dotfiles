# AeroSpace: Option leader for window management; Cmd remains for Ghostty/tmux.

config-version = 2
start-at-login = true
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

persistent-workspaces = [
  '01-term', '02-dev', '03-web', '04-ai', '05-study',
  '06-plan', '07-comms', '08-lab', '09-media', '10-utils',
]

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# Option is the AeroSpace modifier. Cmd remains available to Ghostty/tmux and
# Cmd+Space remains the native Spotlight shortcut.
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Window focus and movement (Vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Outer gaps from the screen edges. The helper updates the active config copy,
# validates it, and reloads AeroSpace without touching the Git-tracked default.
alt-shift-minus = 'exec-and-forget ${HOME}/.local/bin/aerospace-adjust-gaps decrease'
alt-shift-equal = 'exec-and-forget ${HOME}/.local/bin/aerospace-adjust-gaps increase'

# Numeric workspace aliases
alt-1 = 'workspace 01-term'
alt-2 = 'workspace 02-dev'
alt-3 = 'workspace 03-web'
alt-4 = 'workspace 04-ai'
alt-5 = 'workspace 05-study'
alt-6 = 'workspace 06-plan'
alt-7 = 'workspace 07-comms'
alt-8 = 'workspace 08-lab'
alt-9 = 'workspace 09-media'
alt-0 = 'workspace 10-utils'

alt-shift-1 = 'move-node-to-workspace 01-term --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 02-dev --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 03-web --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 04-ai --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 05-study --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 06-plan --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 07-comms --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 08-lab --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 09-media --focus-follows-window'
alt-shift-0 = 'move-node-to-workspace 10-utils --focus-follows-window'

# Mnemonic workspace aliases
alt-t = 'workspace 01-term'
alt-d = 'workspace 02-dev'
alt-w = 'workspace 03-web'
alt-a = 'workspace 04-ai'
alt-s = 'workspace 05-study'
alt-p = 'workspace 06-plan'
alt-c = 'workspace 07-comms'
alt-i = 'workspace 08-lab'
alt-m = 'workspace 09-media'
alt-u = 'workspace 10-utils'

alt-shift-t = 'move-node-to-workspace 01-term --focus-follows-window'
alt-shift-d = 'move-node-to-workspace 02-dev --focus-follows-window'
alt-shift-w = 'move-node-to-workspace 03-web --focus-follows-window'
alt-shift-a = 'move-node-to-workspace 04-ai --focus-follows-window'
alt-shift-s = 'move-node-to-workspace 05-study --focus-follows-window'
alt-shift-p = 'move-node-to-workspace 06-plan --focus-follows-window'
alt-shift-c = 'move-node-to-workspace 07-comms --focus-follows-window'
alt-shift-i = 'move-node-to-workspace 08-lab --focus-follows-window'
alt-shift-m = 'move-node-to-workspace 09-media --focus-follows-window'
alt-shift-u = 'move-node-to-workspace 10-utils --focus-follows-window'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'
alt-r = 'mode resize'
alt-g = 'mode join'
alt-e = 'mode service'
# Disabled: Option+←/→ and Option+Shift+←/→ are left to macOS word navigation.
# alt-left = 'focus-monitor --wrap-around left'
# alt-right = 'focus-monitor --wrap-around right'
# alt-shift-left = 'move-node-to-monitor --wrap-around left'
# alt-shift-right = 'move-node-to-monitor --wrap-around right'
alt-ctrl-left = 'move-workspace-to-monitor --wrap-around left'
alt-ctrl-right = 'move-workspace-to-monitor --wrap-around right'

[mode.resize.binding]
esc = 'mode main'
enter = 'mode main'
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
shift-h = 'resize width -10'
shift-j = 'resize height +10'
shift-k = 'resize height -10'
shift-l = 'resize width +10'

[mode.join.binding]
esc = 'mode main'
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

[mode.service.binding]
esc = 'mode main'
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
b = ['balance-sizes', 'mode main']
a = ['reload-config', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Floating utilities stay on the current workspace.
[[on-window-detected]]
if.app-name-regex-substring = '^(Finder|Passwords|Calculator|Dictionary|Weather|Maps|FindMy|Home|superwhisper|VoicePen)$'
run = 'layout floating'

# Remote desktop goes to Lab and floats.
[[on-window-detected]]
if.app-name-regex-substring = '^(Screen Sharing|AnyDesk)$'
run = ['move-node-to-workspace 08-lab', 'layout floating']

# Settings and VPN/network utilities go to Utils and float.
[[on-window-detected]]
if.app-name-regex-substring = '^(System Settings|Happ Plus|Hiddify|Karing|Karing 2|V2Box|AmneziaVPN|AmneziaVPN 2)$'
run = ['move-node-to-workspace 10-utils', 'layout floating']

# Known transient/modal windows.
[[on-window-detected]]
if.window-title-regex-substring = '(Little Arc|Media Viewer|Huddle|Settings|Run Anything)'
run = 'layout floating'

# 01 — terminals
[[on-window-detected]]
if.app-name-regex-substring = '^(Ghostty|iTerm2|iTerm|Warp|Terminal)$'
run = ['move-node-to-workspace 01-term', 'layout tiling']

# 02 — development
[[on-window-detected]]
if.app-name-regex-substring = '^(Xcode|Cursor|Android Studio|IntelliJ IDEA|JetBrains Toolbox|Docker|Hammerspoon|IDLE|Python Launcher|Visual Studio Code|Bruno|Offset Explorer 4|Nessy Desktop)$'
run = 'move-node-to-workspace 02-dev'

# 03 — browsers
[[on-window-detected]]
if.app-name-regex-substring = '^(Safari|Google Chrome|Arc|Comet|Dia|ChatGPT Atlas|Zen|Matter)$'
run = 'move-node-to-workspace 03-web'

# 04 — AI tools
[[on-window-detected]]
if.app-name-regex-substring = '^(ChatGPT|ChatGPT 2|Codex|Claude|OpenClaw|Assistant|Image Playground|Create ML|LM Studio)$'
run = 'move-node-to-workspace 04-ai'

# 05 — study and writing
[[on-window-detected]]
if.app-name-regex-substring = '^(Obsidian|Microsoft Word|Figma|Notes|Freeform|Anki|Amazon Kindle|Kindle|Moonlitt|Books)$'
run = 'move-node-to-workspace 05-study'

# 06 — planning
[[on-window-detected]]
if.app-name-regex-substring = '^(Calendar|Mail|Structured|Structured 2|Reminders|Journal|Stickies|Microsoft Outlook|Numbers)$'
run = 'move-node-to-workspace 06-plan'

# 07 — communications
[[on-window-detected]]
if.app-name-regex-substring = '^(Telegram|Discord|Messages|FaceTime|Phone|Contacts|Толк|Time)$'
run = 'move-node-to-workspace 07-comms'

# 08 — simulators, remote access, automation and lab tools
[[on-window-detected]]
if.app-name-regex-substring = '^(Simulator|Instruments|Accessibility Inspector|FileMerge|Reality Composer Pro|Icon Composer|Automator|Shortcuts|VirtualBox|DataGrip|T-Insomnia)$'
run = 'move-node-to-workspace 08-lab'

# 09 — media
[[on-window-detected]]
if.app-name-regex-substring = '^(Spotify|Music|Podcasts|TV|QuickTime Player|Photos|TV|VoiceMemos|Voice Memos|Photo Booth|Image Capture|iPhone Mirroring)$'
run = 'move-node-to-workspace 09-media'

# 10 — system and network utilities
[[on-window-detected]]
if.app-name-regex-substring = '^(Activity Monitor|Disk Utility|BetterDisplay|DisplayLink Manager|Raycast Beta|logioptionsplus|Unzip - RAR ZIP 7Z Unarchiver|Cisco|Keka|Posture Pals|Nestor Spotlight)$'
run = 'move-node-to-workspace 10-utils'
