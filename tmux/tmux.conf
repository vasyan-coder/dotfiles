# Ghostty-first tmux configuration

# Technical prefix sent by Ghostty. Option+Space can still send it manually.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Responsive input and reliable terminal capabilities
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# GUI-like numbering and behaviour
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 100000
set -g detach-on-destroy off
setw -g mode-keys vi

# Reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Windows and panes keep the current directory
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane focus and resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane/window actions
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind z resize-pane -Z
bind , command-prompt -I "#W" "rename-window '%%'"
bind y copy-mode
bind Tab last-window
bind -r n next-window
bind -r p previous-window

# Sessions
bind S choose-tree -s
bind -r '(' switch-client -p
bind -r ')' switch-client -n
bind A switch-client -l
bind N command-prompt -p "new session name:" "new-session -d -s '%%' -c '#{pane_current_path}' \; switch-client -t '%%'"
bind R command-prompt -I "#S" "rename-session '%%'"
bind G confirm-before -p "kill session #S? (y/n)" kill-session
bind q detach-client

# Minimal personalized status line
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-right "#[fg=#6c7086]#[bg=#6c7086,fg=#cdd6f4] %d %b #[fg=#89b4fa,bold]%H:%M "
setw -g window-status-format " #[fg=#a6adc8]#I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
